# Open WebUI backed by an Ollama instance running on the host.
#
# Overrides (shell env or a .env file next to this file):
#   WEBUI_IMAGE_TAG  main (default) or a pinned release tag
#   WEBUI_PORT       host port (default 3000)
#   OLLAMA_BASE_URL  Ollama endpoint (default http://host.docker.internal:11434)
#                    only read on first launch, later changes go through Admin Settings > Connections
#
# Ollama binds to 127.0.0.1 by default, which the container cannot reach.
# Run the host's Ollama with OLLAMA_HOST=0.0.0.0.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_IMAGE_TAG:-main}
    container_name: open-webui
    ports:
      - "${WEBUI_PORT:-3000}:8080" # Open WebUI listens on 8080 inside the container
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # first launch can be slow
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  open-webui:
